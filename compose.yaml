services:

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: ecommerce_app

    restart: unless-stopped

    working_dir: /var/www/html

    volumes:
      - .:/var/www/html

    ports:
      - "8000:8000"

    environment:
      APP_ENV: local
      APP_DEBUG: "true"

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    networks:
      - ecommerce


  postgres:
    image: postgres:18-alpine

    container_name: ecommerce_postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: khder
      POSTGRES_PASSWORD: 123

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
           "CMD-SHELL",
           "pg_isready -U khder -d ecommerce"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - ecommerce


  redis:
    image: redis:alpine

    container_name: ecommerce_redis

    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - ecommerce


networks:

  ecommerce:
    driver: bridge


volumes:

  postgres_data:

  redis_data: